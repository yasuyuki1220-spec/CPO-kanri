<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CPO管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPO管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e10">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* 横長パネルを縦に並べるボード。商談中は橙の帯付きで最上段に固定、在庫は長押しで並べ替え。ナンバープレート風の表示が車両の目印。 */
:root{
  --bg:#edf0f4; --surface:#ffffff; --surface-2:#f4f6f9;
  --ink:#121c26; --ink-2:#4a5968; --ink-3:#6f7d8b;
  --line:#d6dde5; --line-strong:#98a4b0;
  --accent:#1d5fd0; --accent-fg:#ffffff;
  --deal:#ff8a1f; --deal-fg:#2b1300; --deal-bg:#fff3e3; --deal-text:#a94200;
  --wait:#5b3fc0; --wait-fg:#ffffff; --wait-bg:#eee9fb;
  --over:#c4261d; --over-fg:#ffffff; --over-bg:#fde8e6;
  --plate-bg:#f7faf5; --plate-ink:#1d5a41;
  --shadow:0 1px 2px rgba(18,28,38,.06);
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#18212a; --surface-2:#1f2a35;
    --ink:#e8eef4; --ink-2:#aab7c4; --ink-3:#8896a4;
    --line:#2b3947; --line-strong:#5b6c7d;
    --accent:#6aa5ff; --accent-fg:#06101f;
    --deal-bg:#34210c; --deal-text:#ffa447;
    --wait:#a58cff; --wait-fg:#140a33; --wait-bg:#261f45;
    --over:#ff7a70; --over-fg:#2a0805; --over-bg:#3d1816;
    --plate-bg:#eef3ec;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#18212a; --surface-2:#1f2a35;
  --ink:#e8eef4; --ink-2:#aab7c4; --ink-3:#8896a4;
  --line:#2b3947; --line-strong:#5b6c7d;
  --accent:#6aa5ff; --accent-fg:#06101f;
  --deal-bg:#34210c; --deal-text:#ffa447;
  --wait:#a58cff; --wait-fg:#140a33; --wait-bg:#261f45;
  --over:#ff7a70; --over-fg:#2a0805; --over-bg:#3d1816;
  --plate-bg:#eef3ec;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 130px;
}
.wrap{max-width:860px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.live i{background:#1e9e5a}
.sync.ro i{background:var(--over)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--font-num);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.stat.deal{border-color:var(--deal)} .stat.deal b{color:var(--deal-text)}
.stat.wait b{color:var(--wait)}
.search input{width:100%}
.kind{display:inline-block;font-size:11px;font-weight:900;line-height:1;padding:3px 7px;border-radius:5px;letter-spacing:.04em;white-space:nowrap;flex:none}
.kind.cpo{background:#1b2a4a;color:#fff}
.kind.ucar{background:#d9dde3;color:#1b1f27;border:1px solid #aab0ba}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kind.cpo{background:#8fb0ff;color:#0b1326}:root:not([data-theme="light"]) .kind.ucar{background:#3a3f49;color:#eef0f4;border-color:#5a606c}}
.kf{display:flex;gap:6px;margin-top:8px}
.kf .chip{min-height:34px;padding:2px 12px;font-size:13px}

/* inputs & buttons */
select,input[type=text],input[type=search],input[type=number],input:not([type]){
  min-height:44px;width:100%;padding:8px 12px;font-size:16px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
}
input::placeholder{color:var(--ink-3)}
select{font:inherit;color:inherit;appearance:auto}
.cm{display:flex;flex-direction:column;min-width:0;line-height:1.3;gap:0}
.cm .colorname{max-width:100%}
.km{font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.row3 .fl{margin-top:0}
.gear{min-height:30px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);white-space:nowrap}
.tr-r{display:flex;align-items:center;gap:8px}
.kf{flex-wrap:wrap;align-items:center}
.sortsel{margin-left:auto;min-height:34px!important;width:auto!important;max-width:170px;padding:2px 8px!important;font-size:13px!important;border-radius:99px!important}
.mrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.mrow input[type=text],.mrow input:not([type]){flex:1;min-width:0;min-height:40px}
.mrow input[type=color],.addrow input[type=color]{flex:none;width:42px;height:40px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.ib{flex:none;min-width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;padding:0 6px}
.ib.d{color:var(--over)}
.ib:disabled{opacity:.3}
.ib.g{min-width:70px;font-size:12px}
.subp{margin:4px 0 12px 10px;padding:6px 10px 10px;border-left:3px solid var(--line-strong);background:var(--surface-2);border-radius:8px}
.msh{margin:18px 0 4px;font-size:14px;font-weight:900}
input.small{min-height:38px;font-size:15px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px}
.btn.block{width:100%}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-deal{background:var(--deal);color:var(--deal-fg);border-color:transparent}
.btn-wait{background:var(--wait);color:var(--wait-fg);border-color:transparent}
.btn-ghost{background:transparent}
.btn-danger{color:var(--over);background:transparent;border-color:var(--over)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px;font-weight:700}
.sec .t{font-size:15px}
.sec .n{font-family:var(--font-num);font-size:19px;margin-left:6px;font-variant-numeric:tabular-nums}
.sec .hint{font-size:11px;color:var(--ink-3);font-weight:400}
.sec.deal{background:var(--deal);color:var(--deal-fg);padding:8px 12px;border-radius:10px}
button.sec{width:100%;background:none;border:0;padding:6px 0;color:var(--ink-3);text-align:left}
.list{position:relative;display:flex;flex-direction:column;gap:8px}
.list[data-sec="deal"]{margin-top:14px}

/* car panel */
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;touch-action:pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:box-shadow .15s ease;
}
.card.lifted{box-shadow:0 16px 34px rgba(0,0,0,.32);z-index:5;cursor:grabbing;outline:2px solid var(--accent)}
.card.flash{animation:flash 1.4s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
.card.deal{border:2px solid var(--deal);background:var(--deal-bg)}
.card.sold{opacity:.62}
.dealbar{display:flex;align-items:center;gap:8px;padding:3px 10px;background:var(--deal);color:var(--deal-fg);font-weight:700;white-space:nowrap;overflow:hidden}
.dealbar .pill{background:var(--deal-fg);color:var(--deal);padding:0 9px;border-radius:99px;font-size:12px;letter-spacing:.06em}
.dealbar .lbl{font-size:11px;font-weight:500}
.dealbar .staff{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.dealbar .sp,.sh-top .sp{flex:1}
.dealbar .until{font-size:12px;font-weight:500}
.dealbar .left{background:var(--surface);color:var(--deal-text);padding:0 9px;border-radius:99px;font-size:12px}
.dealbar .left.today{background:var(--deal-fg);color:var(--deal)}
.dealbar .left.over{background:var(--over);color:var(--over-fg)}
.soldbar{padding:3px 12px;background:var(--ink-3);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.08em}
.main{display:flex;align-items:center;gap:10px;padding:6px 10px}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.l1{display:flex;align-items:baseline;gap:6px;min-width:0;line-height:1.3}
.model{font-size:15.5px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sub{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;flex:none}
.l1 .sub:last-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.l2{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.plate{display:inline-block;font-family:var(--font-num);font-size:13px;font-weight:700;padding:0 6px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-2);color:var(--ink);letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.colorname{font-size:11.5px;color:var(--ink-2);white-space:nowrap;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line-strong);vertical-align:-1px;margin-right:5px}
.eqline{display:flex;gap:4px;overflow:hidden;min-height:17px;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.eq{flex:none;font-size:10.5px;line-height:1.5;padding:0 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.card.deal .eq{background:var(--surface)}
.price{text-align:right;flex:none;white-space:nowrap}
.price b{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.price small{font-size:11px;color:var(--ink-2);margin-left:2px}
.price b.na{color:var(--ink-3)}
.queuebar{display:flex;align-items:center;gap:10px;padding:2px 10px;background:var(--wait-bg);color:var(--wait);font-size:12px;white-space:nowrap;overflow:hidden}
.queuebar b{flex:none}
.queuebar span{overflow:hidden;text-overflow:ellipsis}
.tag-sample{font-size:10px;font-weight:500;padding:0 6px;border:1px dashed var(--ink-3);border-radius:99px;color:var(--ink-3);vertical-align:2px}

.loading,.empty{color:var(--ink-2);text-align:center;padding:40px 0}
.emptybox{margin-top:18px;padding:28px 18px;border:2px dashed var(--line-strong);border-radius:14px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.emptybox h2{margin:0;font-size:18px}
.emptybox p{margin:0;color:var(--ink-2);max-width:32em}
.emptybox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.linkbtn{background:none;border:0;color:var(--ink-3);text-decoration:underline;padding:12px 0;font-size:12px}

/* fab, toast */
.fab{
  position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:20;min-height:54px;padding:0 22px;border-radius:99px;border:0;font-weight:900;font-size:16px;
  background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 22px rgba(0,0,0,.28);
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast button{background:none;border:0;color:var(--deal);font-weight:900;padding:6px 4px;white-space:nowrap}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:580px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);
  border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  overscroll-behavior:contain;
}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sh-main h2{margin:0;font-size:24px;font-weight:900;line-height:1.25}
.sh-main .sub{font-size:13px;margin-top:2px;white-space:normal}
.price.big b{font-size:40px}
.sh-main h2 .sub{font-size:17px;font-weight:700;margin:0;color:var(--ink-2)}
.sh-meta{margin-top:10px;font-size:14px;color:var(--ink-2)}
.eqwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqwrap .eq{font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.sheet h3{margin:0 0 10px;font-size:15px}
.fl{display:block;margin:12px 0 5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.fl.sm{margin-top:0}
.fh{margin:0;font-size:18px}
.row2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{min-height:36px;padding:2px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.daysin{display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.daysin input{width:64px;min-height:36px;padding:2px 8px;text-align:center}
.prev{margin:10px 0;font-size:13px;color:var(--ink-2);min-height:20px}
.neg{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.neg.deal{border-color:var(--deal)}
.neg.wait{border-color:var(--wait)}
.dealbox{padding:12px 14px;border-radius:12px;background:var(--deal);color:var(--deal-fg);margin-bottom:12px}
.dealbox .big{font-size:22px;font-weight:900}
.dealbox .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.dealbox .left{background:var(--surface);color:var(--deal-text);padding:0 10px;border-radius:99px;font-size:13px}
.dealbox .left.today{background:var(--deal-fg);color:var(--deal)}
.dealbox .left.over{background:var(--over);color:var(--over-fg)}
.dealbox .ext{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px}
.dealbox .ext .chip{background:var(--surface);color:var(--ink);border-color:transparent;min-height:32px;font-weight:700}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.queue{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.queue li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--wait-bg);color:var(--wait);font-weight:700}
.queue li .no{font-family:var(--font-num);font-size:20px;width:20px;text-align:center}
.queue li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.queue li .dy{font-weight:400;font-size:12px}
.queue li button{background:none;border:0;color:var(--wait);font-size:20px;padding:2px 8px;line-height:1}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.soldbox{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;color:var(--ink-2)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.colchip{display:inline-flex;align-items:center;min-height:36px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;text-align:left}
.colchip .sw{margin-right:6px;flex:none;width:14px;height:14px}
.colchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.swb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);padding:0}
.swb.on{outline:3px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}
.tags .eq{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 4px 2px 10px}
.tags .eq button{background:none;border:0;padding:0 6px;font-size:16px;line-height:1;color:var(--ink-3)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .btn{flex:none}
.actions{margin-top:20px}
.note{font-size:12px;color:var(--ink-3)}
body.busy .sheet .btn{opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="titlerow"><h1>CPO管理</h1><span class="tr-r"><button class="gear" id="gear" type="button">⚙ 選択肢の設定</button><span class="sync" id="sync"><i></i><span>接続中</span></span></span></div>
    <div class="stats" id="stats"></div>
    <div class="kf" id="kf"></div>
    <div class="search"><input id="q" type="search" placeholder="車種・車両No.・担当者・CPOで探す" autocomplete="off" aria-label="検索"></div>
  </header>
  <main id="app"><p class="loading">読み込み中…</p></main>
</div>
<button class="fab" id="fab" type="button" hidden>＋ 車両を追加</button>
<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
var LS_STAFF='chuko-shodan-staff-v1';
var state={cars:[],ver:'',ready:false,shared:true,readOnly:false,q:'',kf:'',showSold:false,sort:'manual',master:null};
var press=null, pendingRender=false, sheetState=null, neg={staff:'',days:3}, form=null, flashId=null, toastTimer=null, lastDay='';

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseD=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var WD='日月火水木金土';
var fmtMD=function(d){return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
var diffDays=function(a,b){return Math.round((a-b)/86400000)};
var newId=function(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

function remain(until){
  var n=diffDays(parseD(until),today());
  if(n>0)return {t:'あと'+n+'日',cls:''};
  if(n===0)return {t:'本日まで',cls:'today'};
  return {t:(-n)+'日超過',cls:'over'};
}

function shortColor(n){return String(n||'').replace(/ガラスフレーク/g,'GF').replace(/マイカメタリック/g,'MM')}
var COLOR_KEYS=[[/クォーツ/,'#e8e5de'],[/クロム/,'#8f949a'],[/チタニウム/,'#cdb98a'],[/イリジウム/,'#d8dce0'],[/アストログレー/,'#6b7078'],[/カッパー/,'#8c5a3d'],[/アズール|ディープブルー/,'#1e3f73'],[/スピネル/,'#8e1c26'],[/グラファイト/,'#25282c'],[/ブラック|黒/,'#1b1d20'],[/シルバー|銀/,'#c3c8ce'],[/グレー|グレイ|灰|ガンメタ/,'#858b93'],[/レッド|赤|ワイン|ボルドー/,'#d2322d'],[/ブルー|青|紺|ネイビー/,'#2e63c8'],[/グリーン|緑|カーキ/,'#2e8a57'],[/ブラウン|茶/,'#7b5638'],[/ベージュ|ゴールド|シャンパン/,'#d6c19b'],[/イエロー|黄/,'#ebc41f'],[/オレンジ|橙/,'#ef8a2c'],[/パープル|紫/,'#7a55b3'],[/パール/,'#ebe6dc'],[/ホワイト|白/,'#f4f4f1']];
function colorHex(name){
  for(var k=0;k<COLOR_PRESETS.length;k++){if(shortColor(COLOR_PRESETS[k][0])===shortColor(name))return COLOR_PRESETS[k][1]}
  name=String(name||'').split(/[＆&・／]/)[0];
  for(var i=0;i<COLOR_KEYS.length;i++){if(COLOR_KEYS[i][0].test(name))return COLOR_KEYS[i][1]}
  return '#b9bec5';
}
var EQUIP_PRESETS=DEFAULT_MASTER.equip.slice();
var SPOIL=['フロントスポイラー','サイドスポイラー','リヤスポイラー'];
function equipDisplay(list){
  list=list||[];
  if(!SPOIL.every(function(s){return list.indexOf(s)>=0}))return list.slice();
  var out=[],done=false;
  list.forEach(function(e){if(SPOIL.indexOf(e)>=0){if(!done){out.push('フルスポイラー');done=true}}else out.push(e)});
  return out;
}

/* ---------- Firebase（Firestore）: 車両1台 = 1ドキュメント。ドキュメントID = 車両No. ---------- */
var inflight=0, db=null, col=null, unsub=null;
function norm(id,d){return Object.assign({queue:[],equip:[],deal:null,status:'stock',order:0,kind:'',km:null},d,{id:id})}
var fbFail=function(msg){return {ok:false,msg:msg}};
var fbOk=function(x){var o={ok:true};for(var k in (x||{}))o[k]=x[k];return o};
var cleanStaff=function(s){return String(s||'').trim().slice(0,20)};
var cleanDays=function(d){d=parseInt(d,10);return (d>=1&&d<=90)?d:0};
var cleanKind=function(k){return (k==='CPO'||k==='UCAR')?k:''};
var todayStr=function(){return ymd(today())};
var addDaysStr=function(s,n){return ymd(addDays(parseD(s),n))};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var qid=function(){return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
function cleanFields(f){
  f=f||{};
  var price=(f.price===''||f.price==null)?null:Number(f.price);
  if(price!==null&&(isNaN(price)||price<0))price=null;
  return {
    plate:String(f.plate||'').trim(),model:String(f.model||'').trim().slice(0,40),year:String(f.year||'').trim().slice(0,10),
    grade:String(f.grade||'').trim().slice(0,30),price:price,color:String(f.color||'').trim().slice(0,40),
    equip:(f.equip||[]).map(function(x){return String(x).trim().slice(0,30)}).filter(Boolean).slice(0,40),kind:cleanKind(f.kind),
    km:(f.km===''||f.km==null||isNaN(Number(f.km))||Number(f.km)<0)?null:Math.min(9999999,Math.round(Number(f.km)))
  };
}
function strip(c){var o=clone(c);delete o.id;delete o.sample;return o}
function minOrder(){var m=0;state.cars.forEach(function(c){if((c.order||0)<m)m=c.order||0});return m}
/* 1台分の書き換え: 読んで→条件を確認→書く を1つの取引として実行。同時に来たら先に確定した人が優先、後の人は最新の状態で判定されて断られる */
function mutate(id,fn){
  var ref=col.doc(String(id));
  return db.runTransaction(function(t){
    return t.get(ref).then(function(s){
      if(!s.exists)return fbFail('この車両は削除されました');
      var c=norm(String(id),s.data());
      var r=fn(c);
      if(r&&r.ok===false)return r;
      t.set(ref,strip(c));
      return fbOk(r);
    });
  });
}
function handle(action,p){
  var t;
  switch(action){
    case 'save':{
      var f=cleanFields(p.fields);
      if(!f.model)return Promise.resolve(fbFail('車種を入力してください'));
      if(!/^\d{7}$/.test(f.plate))return Promise.resolve(fbFail('車両No.は7桁の数字で入力してください'));
      if(p.id&&p.id===f.plate)return mutate(p.id,function(c){Object.assign(c,f);return {id:f.plate}});
      return db.runTransaction(function(tx){
        var newRef=col.doc(f.plate);
        var reads=[tx.get(newRef)];
        if(p.id)reads.push(tx.get(col.doc(String(p.id))));
        return Promise.all(reads).then(function(rs){
          if(rs[0].exists)return fbFail('その車両No.はすでに登録されています');
          var car;
          if(p.id){
            if(!rs[1].exists)return fbFail('この車両は削除されました');
            car=Object.assign({},rs[1].data(),f); // 車両No.を変更: 新しいIDで作り直す
            tx.delete(col.doc(String(p.id)));
          }else{
            car=Object.assign({order:minOrder()-1,status:'stock',deal:null,queue:[],createdAt:Date.now()},f);
          }
          tx.set(newRef,car);
          return fbOk({id:f.plate});
        });
      });
    }
    case 'delete':{
      var dref=col.doc(String(p.id));
      return db.runTransaction(function(tx){return tx.get(dref).then(function(s){
        if(!s.exists)return fbFail('この車両は削除されました');
        tx.delete(dref);return fbOk({prev:norm(String(p.id),s.data())});
      })});
    }
    case 'restore':{
      var src=p.car||{},rf=cleanFields(src);
      if(!/^\d{7}$/.test(rf.plate)||!rf.model)return Promise.resolve(fbFail('元に戻せませんでした'));
      var rc=Object.assign({
        order:Number(src.order)||0,status:src.status==='sold'?'sold':'stock',
        deal:(src.deal&&src.deal.staff&&src.deal.until)?{staff:cleanStaff(src.deal.staff),days:cleanDays(src.deal.days)||1,startedAt:String(src.deal.startedAt||''),until:String(src.deal.until)}:null,
        queue:(src.queue||[]).map(function(q){return {id:String(q.id||qid()),staff:cleanStaff(q.staff),days:cleanDays(q.days)||1}}).filter(function(q){return q.staff}).slice(0,20),
        createdAt:Number(src.createdAt)||Date.now()
      },rf);
      return col.doc(rf.plate).set(rc).then(function(){return fbOk({})});
    }
    case 'startDeal':
      return mutate(p.id,function(c){
        if(c.status==='sold')return fbFail('この車両はすでに売約済みです');
        if(c.deal)return fbFail(c.deal.staff+'さんが先に商談を開始しました。順番待ちに入れます');
        var staff=cleanStaff(p.staff),days=cleanDays(p.days);
        if(!staff||!days)return fbFail('担当者と期間を入力してください');
        t=todayStr();c.deal={staff:staff,days:days,startedAt:t,until:addDaysStr(t,days)};
      });
    case 'addQueue':
      return mutate(p.id,function(c){
        if(c.status==='sold')return fbFail('この車両はすでに売約済みです');
        if(!c.deal)return fbFail('商談が終了しています。商談を始められます');
        var s2=cleanStaff(p.staff),d2=cleanDays(p.days);
        if(!s2||!d2)return fbFail('担当者と期間を入力してください');
        if(c.queue.length>=20)return fbFail('順番待ちがいっぱいです');
        c.queue.push({id:qid(),staff:s2,days:d2});
      });
    case 'rmQueue':
      return mutate(p.id,function(c){c.queue=c.queue.filter(function(q){return q.id!==p.qid})});
    case 'endDeal':
      return mutate(p.id,function(c){
        if(!c.deal)return fbFail('すでに商談は終了しています');
        var prev=clone(c),q=c.queue.slice(),nxt=q.shift()||null;
        t=todayStr();
        c.deal=nxt?{staff:nxt.staff,days:nxt.days,startedAt:t,until:addDaysStr(t,nxt.days)}:null;
        c.queue=q;
        return {prev:prev,nxt:nxt};
      });
    case 'sold':
      return mutate(p.id,function(c){
        if(c.status==='sold')return fbFail('すでに売約済みです');
        var prev=clone(c);c.status='sold';c.deal=null;c.queue=[];
        return {prev:prev};
      });
    case 'restock':
      return mutate(p.id,function(c){c.status='stock'});
    case 'extend':
      return mutate(p.id,function(c){
        if(!c.deal)return fbFail('すでに商談は終了しています');
        var n=parseInt(p.n,10);
        if(!(n>=1&&n<=30))return fbFail('延長は1〜30日です');
        t=todayStr();var base=c.deal.until<t?t:c.deal.until;
        c.deal.until=addDaysStr(base,n);
      });
    case 'reorder':{
      var ids=(p.ids||[]).map(String);
      return db.runTransaction(function(tx){
        return Promise.all(ids.map(function(id){return tx.get(col.doc(id))})).then(function(ss){
          var found=ss.filter(function(s){return s.exists});
          if(found.length<2)return fbFail('並べ替えできませんでした');
          var b=Math.min.apply(null,found.map(function(s){return Number(s.data().order)||0}));
          var o=0;
          ss.forEach(function(s,i){if(!s.exists)return;var n=b+o++;if((Number(s.data().order)||0)!==n)tx.update(col.doc(ids[i]),{order:n})});
          return fbOk({});
        });
      });
    }
  }
  return Promise.resolve(fbFail('不明な操作です'));
}
async function act(action,p){
  inflight++;document.body.classList.add('busy');
  try{
    return await handle(action,p||{});
  }catch(e){
    var perm=e&&e.code==='permission-denied';
    if(!perm){state.shared=false;renderHead()}
    toast(perm?'書き込みが許可されていません（Firestoreのルール設定を確認してください）':'通信に失敗しました。電波を確認してもう一度お試しください');
    return {ok:false,msg:null,failed:true};
  }finally{
    inflight--;
    if(!inflight)document.body.classList.remove('busy');
  }
}
function applyMaster(data){
  var m=clone(DEFAULT_MASTER);
  if(data){['models','grades','colors','equip'].forEach(function(k){if(Array.isArray(data[k]))m[k]=data[k]})}
  m.models=m.models.map(function(x){return {name:String(x.name||''),grades:Array.isArray(x.grades)?x.grades:[]}});
  state.master=m;
  COLOR_PRESETS=m.colors.map(function(c){return [c.name,c.hex]});
  EQUIP_PRESETS=m.equip.slice();
}
applyMaster(null);
function connect(){
  if(typeof firebase==='undefined'||typeof FIREBASE_CONFIG==='undefined'||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey||/ここに/.test(FIREBASE_CONFIG.apiKey)){
    state.ready=false;$('#app').innerHTML='<div class="emptybox"><h2>Firebaseの設定が未入力です</h2><p>firebase-config.js に、Firebaseコンソールの設定値を貼り付けてください。</p></div>';return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();col=db.collection('cars');
  db.collection('config').doc('master').onSnapshot(function(s){applyMaster(s.exists?s.data():null);render()},function(){});
  unsub=col.onSnapshot(function(snap){
    state.cars=snap.docs.map(function(d){return norm(d.id,d.data())});
    var live=!snap.metadata.fromCache;
    state.shared=live;state.ready=true;
    render();
  },function(err){
    state.shared=false;state.ready=true;renderHead();
    toast(err&&err.code==='permission-denied'?'読み取りが許可されていません（Firestoreのルール設定を確認してください）':'接続できません。自動で再接続します');
  });
}
function findCar(id){return state.cars.find(function(c){return c.id===id})}

/* ---------- staff names ---------- */
function staffList(){
  var seen={},out=[];
  var add=function(n){if(n&&!seen[n]){seen[n]=1;out.push(n)}};
  try{(JSON.parse(localStorage.getItem(LS_STAFF)||'[]')||[]).forEach(add)}catch(e){}
  state.cars.forEach(function(c){if(c.deal)add(c.deal.staff);(c.queue||[]).forEach(function(q){add(q.staff)})});
  return out.slice(0,8);
}
function rememberStaff(n){
  try{var l=(JSON.parse(localStorage.getItem(LS_STAFF)||'[]')||[]).filter(function(x){return x!==n});l.unshift(n);localStorage.setItem(LS_STAFF,JSON.stringify(l.slice(0,12)))}catch(e){}
}

/* ---------- derive ---------- */
var byOrder=function(a,b){return (a.order||0)-(b.order||0)||String(a.id).localeCompare(String(b.id))};
function hay(c){return [kindName(c.kind),c.model,c.plate,c.grade,c.year,c.color,equipDisplay(c.equip).join(' '),c.deal&&c.deal.staff,(c.queue||[]).map(function(q){return q.staff}).join(' ')].join(' ').toLowerCase()}
function sections(){
  var q=state.q.trim().toLowerCase();
  var f=q?state.cars.filter(function(c){return hay(c).indexOf(q)>=0}):state.cars.slice();
  if(state.kf)f=f.filter(function(c){return c.kind===state.kf});
  return {
    deal:f.filter(function(c){return c.status!=='sold'&&c.deal}).sort(sorter()),
    stock:f.filter(function(c){return c.status!=='sold'&&!c.deal}).sort(sorter()),
    sold:f.filter(function(c){return c.status==='sold'}).sort(sorter())
  };
}
var canDrag=function(){return !state.q.trim()&&!state.kf&&!state.readOnly&&state.sort==='manual'};
var SORTS=[['manual','並び順：手動'],['price_asc','金額が安い順'],['price_desc','金額が高い順'],['year_desc','年式が新しい順'],['year_asc','年式が古い順'],['km_asc','走行距離が少ない順'],['km_desc','走行距離が多い順'],['model','車種順']];
function yearVal(y){
  var s=String(y||'').trim(),m;
  if(/^\d{4}$/.test(s))return +s;
  if((m=s.match(/^R\s*(\d{1,2})/i)))return 2018+ +m[1];
  if((m=s.match(/^H\s*(\d{1,2})/i)))return 1988+ +m[1];
  if((m=s.match(/^S\s*(\d{1,2})/i)))return 1925+ +m[1];
  return null;
}
function sorter(){
  var k=state.sort;
  if(k==='manual')return byOrder;
  var get={price_asc:function(c){return c.price},price_desc:function(c){return c.price},year_desc:function(c){return yearVal(c.year)},year_asc:function(c){return yearVal(c.year)},km_asc:function(c){return c.km},km_desc:function(c){return c.km}}[k];
  if(k==='model')return function(a,b){return String(a.model).localeCompare(String(b.model),'ja')||byOrder(a,b)};
  var desc=/_desc$/.test(k);
  return function(a,b){
    var x=get(a),y=get(b),nx=(x==null||x===''),ny=(y==null||y==='');
    if(nx&&ny)return byOrder(a,b);
    if(nx)return 1;if(ny)return -1;
    return (desc?y-x:x-y)||byOrder(a,b);
  };
}

/* ---------- html builders ---------- */
function yearText(y){y=String(y||'').trim();return /^\d{4}$/.test(y)?y+'年':y}
function kindName(k){return k==='CPO'?'CPO':(k==='UCAR'?'U-Car':'')}
function kindHTML(c){var n=kindName(c.kind);return n?'<span class="kind '+(c.kind==='CPO'?'cpo':'ucar')+'">'+n+'</span>':''}
function subLine(c){return [c.grade,yearText(c.year)].filter(Boolean).map(esc).join(' · ')}
function priceHTML(c){
  var p=c.price;
  if(p===null||p===undefined||p===''||isNaN(Number(p)))return '<b class="na">—</b>';
  return '<b>'+Number(p).toFixed(1)+'</b><small>万円</small>';
}
function kmText(c){return (c.km==null||c.km===''||isNaN(Number(c.km)))?'':Number(c.km).toLocaleString('ja-JP')+'km'}
function cmHTML(c){
  var col=colorHTML(c),km=kmText(c);
  if(!col&&!km)return '';
  return '<span class="cm">'+col+(km?'<span class="km">'+km+'</span>':'')+'</span>';
}
function colorHTML(c){
  if(!c.color)return '';
  return '<span class="colorname"><i class="sw" style="background:'+colorHex(c.color)+'"></i>'+esc(shortColor(c.color))+'</span>';
}
function cardHTML(c){
  var sold=c.status==='sold',d=c.deal,bar='';
  if(sold)bar='<div class="soldbar">売約済み</div>';
  else if(d){
    var r=remain(d.until);
    bar='<div class="dealbar"><span class="pill">商談中</span><span class="lbl">担当</span><b class="staff">'+esc(d.staff)+'</b><span class="sp"></span><span class="until">〜'+fmtMD(parseD(d.until))+'</span><span class="left '+r.cls+'">'+r.t+'</span></div>';
  }
  var q=c.queue||[];
  var qbar=(q.length&&!sold)?'<div class="queuebar"><b>順番待ち '+q.length+'名</b><span>'+q.map(function(x,i){return (i+1)+' '+esc(x.staff)}).join('　')+'</span></div>':'';
  var eq='<div class="eqline">'+equipDisplay(c.equip).map(function(e){return '<span class="eq">'+esc(e)+'</span>'}).join('')+'</div>';
  var sub=subLine(c);
  return '<div class="card'+(d&&!sold?' deal':'')+(sold?' sold':'')+'" data-id="'+esc(c.id)+'" role="button" tabindex="0" aria-label="'+esc(c.model)+'">'+bar+
    '<div class="main"><div class="info"><div class="l2">'+kindHTML(c)+(c.plate?'<span class="plate">No.'+esc(c.plate)+'</span>':'')+cmHTML(c)+(c.sample?'<span class="tag-sample">サンプル</span>':'')+'</div>'+'<div class="l1">'+(yearText(c.year)?'<span class="sub">'+esc(yearText(c.year))+'</span>':'')+'<span class="model">'+esc(c.model)+'</span>'+(c.grade?'<span class="sub">'+esc(c.grade)+'</span>':'')+'</div>'+
    eq+'</div>'+
    '<div class="price">'+priceHTML(c)+'</div></div>'+qbar+'</div>';
}
function secHTML(kind,title,n,hint){
  return '<div class="sec '+kind+'"><span><span class="t">'+title+'</span><span class="n">'+n+'</span><span class="t">台</span></span>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>';
}
function listHTML(kind,arr){return '<div class="list" data-sec="'+kind+'">'+arr.map(cardHTML).join('')+'</div>'}
function emptyHTML(){
  return '<div class="emptybox"><h2>まだ車両がありません</h2><p>右下の「＋ 車両を追加」から登録します。</p><div class="row"><button class="btn btn-primary" type="button" data-top="new">＋ 車両を追加</button></div></div>';
}

/* ---------- main render ---------- */
function render(){
  if(press&&press.lifted){pendingRender=true;return}
  pendingRender=false;
  renderHead();renderList();

}
function renderHead(){

  var dealN=state.cars.filter(function(c){return c.status!=='sold'&&c.deal}).length;

  var s=$('#sync');

  s.title=state.shared?'同じリンクを開いた全員にすぐ反映されます':'サーバーに接続できません。自動で再接続します';

function renderList(){
  var app=$('#app');
  if(!state.ready){app.innerHTML='<p class="loading">読み込み中…</p>';return}
  if(!state.cars.length){app.innerHTML=emptyHTML();return}
  var s=sections(),h='';
  if(!s.deal.length&&!s.stock.length&&!s.sold.length)h='<p class="empty">該当する車両がありません</p>';
  if(s.deal.length)h+=listHTML('deal',s.deal);
  if(s.stock.length)h+=secHTML('stock','在庫',s.stock.length,canDrag()?'長押しでつかんで並べ替え':'')+listHTML('stock',s.stock);
  if(s.sold.length){
    var open=state.showSold||!!state.q.trim();
    h+='<button class="sec sold" type="button" data-top="sold"><span><span class="t">売約済み</span><span class="n">'+s.sold.length+'</span><span class="t">台</span></span><span class="hint">'+(open?'閉じる':'開く')+'</span></button>';
    if(open)h+=listHTML('sold',s.sold);
  }
  app.innerHTML=h;
  if(flashId){
    var id=flashId;flashId=null;
    requestAnimationFrame(function(){
      var el=app.querySelector('[data-id="'+id+'"]');

    });

/* ---------- toast ---------- */
function toast(msg,undo){
  var t=$('#toast');clearTimeout(toastTimer);
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button">元に戻す</button>':'');
  t.hidden=false;
  if(undo)t.querySelector('button').onclick=function(){t.hidden=true;undo()};
  toastTimer=setTimeout(function(){t.hidden=true},undo?7000:3200);
}

/* ---------- sheet ---------- */

function showSheet(){$('#backdrop').hidden=false;lockScroll(true);$('#sheet').scrollTop=0}
function closeSheet(){sheetState=null;$('#backdrop').hidden=true;lockScroll(false)}
function openSheet(id){
  var c=findCar(id);if(!c)return;

function refreshSheet(force){
  var c=findCar(sheetState.id);

function updateNegUI(){

  $('#tags').innerHTML=form.equip.filter(function(e){return EQUIP_PRESETS.indexOf(e)<0}).map(function(e){return '<span class="eq">'+esc(e)+'<button type="button" data-act="rmTag" data-v="'+esc(e)+'" aria-label="'+esc(e)+'を外す">×</button></span>'}).join('');
  $('#eqSuggest').innerHTML=EQUIP_PRESETS.map(function(e){var on=form.equip.indexOf(e)>=0;return '<button type="button" class="chip'+(on?' on':'')+'" data-act="sugTag" data-v="'+e+'">'+e+'</button>'}).join('')+(SPOIL.every(function(s){return form.equip.indexOf(s)>=0})?'<span class="note">→「フルスポイラー」と表示されます</span>':'');
}
function addTags(text){
  String(text||'').split(/[、,，\s]+/).forEach(function(t){t=t.trim();if(t&&form.equip.indexOf(t)<0)form.equip.push(t)});
  renderTags();
}
async function saveForm(){
  if(acting)return;
  var t=$('#f-eq');if(t&&t.value.trim()){addTags(t.value);t.value=''}
  var f=form;
  if(!f.model.trim()){toast('車種を選ぶか、入力してください');return}
  if(!/^\d{7}$/.test(f.plate)){toast('車両No.は7桁の数字で入力してください');var pl=$('#f-plate');if(pl)pl.focus();return}
  var price=f.price===''?null:parseFloat(f.price);
  var fields={plate:f.plate.trim(),model:f.model.trim(),year:f.year.trim(),grade:f.grade.trim(),price:(price==null||isNaN(price))?null:price,color:shortColor(f.color.trim()),equip:f.equip.slice(),kind:f.kind||'',km:(String(f.km).trim()===''?null:parseInt(f.km,10))};
  var editId=sheetState.id;
  acting=true;
  var btn=document.querySelector('[data-act="saveForm"]');
  if(btn){btn.disabled=true;btn.textContent='保存中…'}
  var r=await act('save',{id:editId,fields:fields});
  acting=false;
  if(!r.ok){
    if(btn){btn.disabled=false;btn.textContent='保存'}
    if(r.msg)toast(r.msg);
    return;
  }
  if(editId){openSheet(r.id||editId);toast('保存しました')}
  else{flashId=r.id;closeSheet();render();toast('追加しました')}
}

/* ---- deal actions（すべてサーバーで順番に処理。同時なら先に届いた人が優先） ---- */
var acting=false;
function cur(){return sheetState&&findCar(sheetState.id)}
function guard(){return true}
async function run(action,p,after){
  if(acting)return;
  acting=true;
  var g=$('#nGo');if(g){g.disabled=true;g.textContent='処理中…'}
  try{
    var r=await act(action,p);
    if(r.failed){if(sheetState&&sheetState.mode==='view')refreshSheet(true);return}
    if(r.ok)after(r);
    else{if(r.msg)toast(r.msg);if(sheetState&&sheetState.mode==='view')refreshSheet(true)}
  }finally{acting=false;updateNegUI()}
}
function undo(prev){
  act('restore',{car:prev}).then(function(r){if(r.ok)toast('元に戻しました');else if(r.msg)toast(r.msg)});
}
function startDeal(){
  var c=cur();if(!c)return;
  var staff=neg.staff.trim(),days=neg.days;if(!staff||days<1)return;
  run('startDeal',{id:c.id,staff:staff,days:days},function(){
    rememberStaff(staff);flashId=c.id;closeSheet();render();toast(staff+'さんの商談を開始しました');
  });
}
function addQueue(){
  var c=cur();if(!c)return;
  var staff=neg.staff.trim(),days=neg.days;if(!staff||days<1)return;
  run('addQueue',{id:c.id,staff:staff,days:days},function(){
    rememberStaff(staff);neg.staff='';
    var el=$('#nStaff');if(el)el.value='';
    var sc=$('#staffChips');if(sc)sc.innerHTML=staffChipsHTML();
    toast(staff+'さんを順番待ちに追加しました');
  });
}
function endDeal(){
  var c=cur();if(!c)return;
  run('endDeal',{id:c.id},function(r){
    closeSheet();
    toast(r.nxt?(r.prev.deal.staff+'さんの商談を終了。次は'+r.nxt.staff+'さんです'):(r.prev.deal.staff+'さんの商談を終了しました'),function(){undo(r.prev)});
  });
}
function markSold(){
  var c=cur();if(!c)return;
  run('sold',{id:c.id},function(r){closeSheet();toast('成約（売約済み）にしました',function(){undo(r.prev)})});
}
function restock(){
  var c=cur();if(!c)return;
  run('restock',{id:c.id},function(){flashId=c.id;closeSheet();render();toast('在庫に戻しました')});
}
function extend(n){
  var c=cur();if(!c||!c.deal)return;
  run('extend',{id:c.id,n:n},function(){});
}
function rmQueue(qid){
  var c=cur();if(!c)return;
  run('rmQueue',{id:c.id,qid:qid},function(){});
}
function deleteCurrent(){
  var c=cur();if(!c)return;
  run('delete',{id:c.id},function(r){closeSheet();toast('「'+r.prev.model+'」を削除しました',function(){undo(r.prev)})});
}

    h+='<div class="msh">ボディカラー（左の四角で色を選べます）</div>';
    ms.colors.forEach(function(c,i){
      h+=msRow('colors',i,c.name,null,'<input type="color" data-ml="colors" data-i="'+i+'" data-k="hex" value="'+esc(/^#[0-9a-fA-F]{6}$/.test(c.hex)?c.hex:'#888888')+'">'+textIn('colors',i,c.name,null,'name','例：ホワイトノーヴァ(GF)'));
    });
    h+='<button type="button" class="btn sm" data-act="msAdd" data-l="colors">＋ 色を追加</button>';
  }else{
    h+='<div class="msh">装備品（車両追加画面にボタンで出ます）</div>';
    ms.equip.forEach(function(e,i){h+=msRow('equip',i,e,null,textIn('equip',i,e,null,'','装備名'))});
    h+='<button type="button" class="btn sm" data-act="msAdd" data-l="equip">＋ 装備を追加</button>';
    h+='<div class="note" style="margin-top:8px">フロント・サイド・リヤの3つのスポイラーがそろうと「フルスポイラー」と表示されます（この3つの名前は変えないでください）。</div>';
  }
  h+='<div class="note" style="margin-top:14px">※名前を変えても、すでに登録済みの車両の表示は変わりません。変更は全員の画面に反映されます。</div>'+
    '<div class="actions"><button class="btn btn-primary block" type="button" data-act="msSave">保存</button>'+
    '<button class="btn block" type="button" data-act="msReset" style="margin-top:8px">初期の選択肢に戻す（保存するまで反映されません）</button></div>';
  return h;
}
function drawSettings(){
  var s=$('#sheet'),top=s.scrollTop;
  s.innerHTML=settingsHTML();s.scrollTop=top;
}
function msAct(a,b){
  var l=b.dataset.l,i=+b.dataset.i,m=b.dataset.m;
  if(a==='msTab'){msTabV=b.dataset.v;msOpenI=-1;drawSettings();$('#sheet').scrollTop=0}
  else if(a==='msOpen'){msOpenI=(msOpenI===i?-1:i);drawSettings()}
  else if(a==='msUp'||a==='msDown'){
    var arr=msArr(l,m),j=a==='msUp'?i-1:i+1;
    if(j<0||j>=arr.length)return;
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
    if(l==='models'&&msOpenI===i)msOpenI=j;else if(l==='models'&&msOpenI===j)msOpenI=i;
    drawSettings();
  }
  else if(a==='msDel'){
    msArr(l,m).splice(i,1);
    if(l==='models'){if(msOpenI===i)msOpenI=-1;else if(msOpenI>i)msOpenI--}
    drawSettings();
  }
  else if(a==='msAdd'){
    var ar=msArr(l,m);
    ar.push(l==='models'?{name:'',grades:[]}:l==='colors'?{name:'',hex:'#888888'}:'');
    if(l==='models')msOpenI=-1;
    drawSettings();
    var ins=$('#sheet').querySelectorAll('input[data-ml="'+l+'"]'+(m!=null&&m!==undefined?'[data-m="'+m+'"]':':not([data-m])')+'[data-i="'+(ar.length-1)+'"]:not([type=color])');
    if(ins.length)ins[ins.length-1].focus({preventScroll:false});
  }
  else if(a==='msReset'){ms=clone(DEFAULT_MASTER);msOpenI=-1;drawSettings();toast('初期の選択肢を表示しました。「保存」で確定します')}
  else if(a==='msCancel')closeSheet();
  else if(a==='msSave')msSave();
}
function uniq(a){var s={};return a.filter(function(x){if(!x||s[x])return false;s[x]=1;return true})}
async function msSave(){
  var out={
    models:[],grades:uniq(ms.grades.map(function(g){return String(g).trim()})),
    colors:[],equip:uniq(ms.equip.map(function(g){return String(g).trim()}))
  };
  var seen={};
  ms.models.forEach(function(m){
    var n=String(m.name).trim();if(!n)return;
    var gs=(m.grades||[]).map(function(g){return String(g).trim()});
    if(seen[n]){seen[n].grades=uniq(seen[n].grades.concat(gs));return}
    seen[n]={name:n,grades:uniq(gs)};out.models.push(seen[n]);
  });
  var cs={};
  ms.colors.forEach(function(c){
    var n=shortColor(String(c.name).trim());if(!n||cs[n])return;cs[n]=1;
    out.colors.push({name:n,hex:/^#[0-9a-fA-F]{6}$/.test(c.hex)?c.hex:'#888888'});
  });
  if(!out.models.length){toast('車種が1つもありません');return}
  var btn=document.querySelector('[data-act="msSave"]');if(btn)btn.disabled=true;
  try{
    await db.collection('config').doc('master').set(out);
    applyMaster(out);closeSheet();render();toast('選択肢を保存しました');
  }catch(err){
    if(btn)btn.disabled=false;
    toast(err&&err.code==='permission-denied'?'保存できません：Firestoreのルールに config の許可を追加してください':'保存に失敗しました。通信を確認してください');
  }
}

/* ---------- events: sheet ---------- */
var sheet=$('#sheet');
sheet.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==='close')closeSheet();
  else if(a==='edit'){if(guard())openForm(sheetState.id)}
  else if(a==='cancelForm'){if(sheetState.id)openSheet(sheetState.id);else closeSheet()}
  else if(a==='pickStaff'){neg.staff=v;var i=$('#nStaff');if(i)i.value=v;$('#staffChips').innerHTML=staffChipsHTML();updateNegUI()}
  else if(a==='pickDays'){neg.days=Number(v);var d=$('#nDays');if(d)d.value=v;updateNegUI()}
  else if(a==='startDeal')startDeal();
  else if(a==='addQueue')addQueue();
  else if(a==='endDeal')endDeal();
  else if(a==='sold')markSold();
  else if(a==='restock')restock();
  else if(a==='extend')extend(Number(v));
  else if(a==='rmQueue')rmQueue(v);
  else if(a==='delete')deleteCurrent();
  else if(a==='pickColor'){form.color=(form.color===v?'':v);$('#f-color').value=form.color;renderSwatches()}
  else if(a==='addTag'){var t=$('#f-eq');addTags(t.value);t.value='';t.focus()}
  else if(a==='sugTag'){var si=form.equip.indexOf(v);if(si>=0)form.equip.splice(si,1);else form.equip.push(v);renderTags()}
  else if(a==='rmTag'){var ri=form.equip.indexOf(v);if(ri>=0)form.equip.splice(ri,1);renderTags()}
  else if(a==='pickKind'){form.kind=(form.kind===v?'':v);var kp=$('#kindPick');if(kp)kp.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x.dataset.v===form.kind)})}
  else if(a==='saveForm')saveForm();
  else if(a.indexOf('ms')===0)msAct(a,b);
});
sheet.addEventListener('change',function(e){
  var t=e.target,k=t.dataset.sel;if(!k)return;
  var v=t.value;
  if(k==='model'){
    if(v==='__other__'){form.mo=true;form.model=''}else{form.mo=false;form.model=v}
    if(!form.go&&form.grade&&gradeList(form.model).indexOf(form.grade)<0)form.grade='';
    renderPickers();
    if(form.mo){var im=$('#f-model');if(im)im.focus()}
  }else if(k==='grade'){
    if(v==='__other__'){form.go=true;form.grade=''}else{form.go=false;form.grade=v}
    renderPickers();
    if(form.go){var ig=$('#f-grade');if(ig)ig.focus()}
  }
});
sheet.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.ml){
    var arr=msArr(t.dataset.ml,t.dataset.m),ix=+t.dataset.i;
    if(t.dataset.ml==='models'||t.dataset.ml==='colors')arr[ix][t.dataset.k||'name']=t.value;else arr[ix]=t.value;
    return;
  }
  if(t.dataset.n==='staff'){neg.staff=t.value;var sc=$('#staffChips');if(sc){sc.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.dataset.v===neg.staff)})}updateNegUI()}
  else if(t.dataset.n==='days'){neg.days=parseInt(t.value,10)||0;updateNegUI()}
  else if(t.dataset.f){if(t.dataset.f==='plate'){var dg=t.value.replace(/[０-９]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-65248)}).replace(/\D/g,'').slice(0,7);if(dg!==t.value)t.value=dg}if(t.dataset.f==='km'){var kd=t.value.replace(/[０-９]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-65248)}).replace(/\D/g,'').slice(0,7);if(kd!==t.value)t.value=kd}form[t.dataset.f]=t.value;if(t.dataset.f==='color')renderSwatches()}
});
sheet.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='f-eq'){e.preventDefault();addTags(e.target.value);e.target.value=''}
  else if(e.target.id==='nStaff'){e.preventDefault();var g=$('#nGo');if(g&&!g.disabled)g.click()}
});
$('#backdrop').addEventListener('click',function(e){if(e.target===this)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetState)closeSheet()});

/* ---------- events: page ---------- */
$('#fab').addEventListener('click',function(){if(guard())openForm(null)});
$('#kf').addEventListener('change',function(e){
  if(e.target.id!=='sortSel')return;
  state.sort=e.target.value;
  try{localStorage.setItem('cpo-sort',state.sort)}catch(x){}
  render();
});
$('#gear').addEventListener('click',function(){openSettings()});
$('#kf').addEventListener('click',function(e){var b=e.target.closest('[data-kf]');if(!b)return;state.kf=(state.kf===b.dataset.kf?'':b.dataset.kf);render()});
$('#q').addEventListener('input',function(){state.q=this.value;render()});
$('#app').addEventListener('click',function(e){
  var b=e.target.closest('[data-top]');if(!b)return;
  var a=b.dataset.top;
  if(a==='new'){if(guard())openForm(null)}
  else if(a==='sold'){state.showSold=!state.showSold;render()}
});
$('#app').addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openSheet(e.target.dataset.id)}
});
$('#app').addEventListener('contextmenu',function(e){if(e.target.closest('.card'))e.preventDefault()});

/* ---------- long press + drag reorder ---------- */
$('#app').addEventListener('pointerdown',function(e){
  var card=e.target.closest('.card');
  if(!card||(e.pointerType==='mouse'&&e.button!==0))return;
  var list=card.parentElement;
  press={id:card.dataset.id,card:card,list:list,x:e.clientX,y:e.clientY,lastY:e.clientY,pid:e.pointerId,lifted:false,moved:false,grab:0,timer:null,raf:0,sec:list.dataset.sec};
  if(canDrag()&&press.sec!=='sold'){
    var p=press;
    p.timer=setTimeout(function(){lift(p)},380);
  }
});
function lift(p){
  if(press!==p)return;
  p.lifted=true;
  var r=p.card.getBoundingClientRect();
  p.grab=p.y-r.top;
  p.card.classList.add('lifted');
  p.card.style.transition='box-shadow .15s ease';
  try{p.card.setPointerCapture(p.pid)}catch(err){}
  try{navigator.vibrate&&navigator.vibrate(14)}catch(err){}
  dragUpdate();
  p.raf=requestAnimationFrame(autoScroll);
}
function flipMove(card,list,target,before){
  var sibs=[].filter.call(list.children,function(c){return c!==card});
  var first=sibs.map(function(c){return c.getBoundingClientRect().top});
  if(before)list.insertBefore(card,target);else target.after(card);
  sibs.forEach(function(c,i){
    var d=first[i]-c.getBoundingClientRect().top;
    if(d){
      c.style.transition='none';c.style.transform='translateY('+d+'px)';
      c.getBoundingClientRect();
      c.style.transition='transform .18s ease';c.style.transform='';
    }
  });
}
function dragUpdate(){
  if(!press||!press.lifted)return;
  var card=press.card,list=press.list,lr=list.getBoundingClientRect();
  var ty=press.lastY-lr.top-press.grab-card.offsetTop;
  card.style.transform='translateY('+ty+'px) scale(1.025)';
  var kids=[].slice.call(list.children),idx=kids.indexOf(card);
  var cy=card.offsetTop+ty+card.offsetHeight/2,target=null,before=true,i,c;
  for(i=0;i<idx;i++){c=kids[i];if(cy<c.offsetTop+c.offsetHeight/2){target=c;before=true;break}}
  if(!target){for(i=kids.length-1;i>idx;i--){c=kids[i];if(cy>c.offsetTop+c.offsetHeight/2){target=c;before=false;break}}}
  if(target){
    flipMove(card,list,target,before);
    ty=press.lastY-lr.top-press.grab-card.offsetTop;
    card.style.transform='translateY('+ty+'px) scale(1.025)';
  }
}
function autoScroll(){
  if(!press||!press.lifted)return;
  var y=press.lastY,vh=window.innerHeight,edge=90,dy=0;
  if(y<edge)dy=-Math.min(18,Math.ceil((edge-y)/5));
  else if(y>vh-edge)dy=Math.min(18,Math.ceil((y-(vh-edge))/5));
  if(dy){window.scrollBy(0,dy);dragUpdate()}
  press.raf=requestAnimationFrame(autoScroll);
}
window.addEventListener('pointermove',function(e){
  if(!press||e.pointerId!==press.pid)return;
  if(press.lifted){press.lastY=e.clientY;dragUpdate();return}
  if(Math.abs(e.clientX-press.x)>8||Math.abs(e.clientY-press.y)>8){press.moved=true;clearTimeout(press.timer)}
});
function endPress(e,cancelled){
  if(!press||e.pointerId!==press.pid)return;
  var p=press;clearTimeout(p.timer);cancelAnimationFrame(p.raf);
  if(p.lifted){
    var card=p.card;
    card.classList.remove('lifted');
    card.style.transition='transform .2s ease, box-shadow .2s ease';
    card.style.transform='';
    setTimeout(function(){card.style.transition=''},260);
    press=null;
    commitOrder(p.list);
    if(pendingRender)render();
  }else{
    press=null;
    if(!cancelled&&!p.moved)openSheet(p.id);
  }
}
window.addEventListener('pointerup',function(e){endPress(e,false)});
window.addEventListener('pointercancel',function(e){endPress(e,true)});
document.addEventListener('touchmove',function(e){if(press&&press.lifted)e.preventDefault()},{passive:false});

function commitOrder(list){
  var ids=[].map.call(list.children,function(c){return c.dataset.id});
  var cars=ids.map(findCar).filter(Boolean);
  if(cars.length<2)return;
  var base=Math.min.apply(null,cars.map(function(c){return c.order||0}));
  cars.forEach(function(c,i){c.order=base+i});
  act('reorder',{ids:ids});
}

/* ---------- boot ---------- */
lastDay=ymd(today());
try{var sv=localStorage.getItem('cpo-sort');if(sv&&SORTS.some(function(o){return o[0]===sv}))state.sort=sv}catch(x){}
setInterval(function(){var k=ymd(today());if(k!==lastDay){lastDay=k;render()}},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){lastDay=ymd(today());render()}});
render();
connect();
})();
